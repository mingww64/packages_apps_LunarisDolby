name: Sync upstream LunarisDolby

on:
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-lunarisdolby-update]
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '16'

      - name: Fetch upstream app
        run: |
          git clone --depth 1 --branch 16 https://github.com/Pong-Development/hardware_dolby.git upstream
          rsync -a --delete --exclude '.git/' --exclude '.github/' --exclude 'README.md' upstream/LunarisDolby/ ./
          sed -i '1i soong_namespace {}\n' Android.bp
          rm -rf upstream

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet || git commit -m 'Sync LunarisDolby from Pong 16'
          git push
